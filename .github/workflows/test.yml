name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24", "26"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          # Bundled npm is <12; caching would run it against package.json and fail devEngines.
          package-manager-cache: false

      - name: Use npm 12
        working-directory: ${{ runner.temp }}
        run: npm install -g npm@12

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload test results to Codecov
        if: ${{ matrix.node-version == '24' && env.HAS_CODECOV_TOKEN == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: CaptorAB/openseries-ts
          files: junit.xml
          report_type: test_results
          fail_ci_if_error: true
          verbose: true

      - name: Upload coverage to Codecov
        if: ${{ matrix.node-version == '24' && env.HAS_CODECOV_TOKEN == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: CaptorAB/openseries-ts
          files: coverage/lcov.info,coverage/cobertura-coverage.xml
          fail_ci_if_error: true
          verbose: true
